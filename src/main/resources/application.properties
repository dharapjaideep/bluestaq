spring.application.name=demo

# Application version; kept in sync with the VERSION file at the repo root.
app.version=0.2.0

# TEMPORARY in-memory H2 database for the take-home; data is lost on every restart.
# Replace with a persistent database (and schema management) before real use.
spring.datasource.url=jdbc:h2:mem:demo;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# schema.sql owns the schema and runs on every startup (also for non-embedded databases,
# so this keeps working after the move off in-memory H2). Hibernate only validates that
# the entities match it and fails startup if they do not (fail safe).
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 web console at /h2-console (development only - see SecurityConfig).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Seed demo users/team/notes on startup when there are no users (DemoDataSeeder, README.md).
# TEMPORARY for the demo: the demo accounts share a published password; set to false (or
# remove) before any real deployment. Tests turn this off in src/test/resources/config/.
app.demo-data.enabled=true
