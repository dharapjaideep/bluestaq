spring.application.name=demo

# Application version; kept in sync with the VERSION file at the repo root.
app.version=0.4.1

# TEMPORARY file-based H2 database for the take-home: data persists between runs in ./data/
# (relative to the directory the app is started from; git-ignored). Delete data/ to reset to
# the demo state, or after changing schema.sql (CREATE TABLE IF NOT EXISTS won't alter an
# existing table). Replace with PostgreSQL + migrations before real use.
# Tests override this with an in-memory database (src/test/resources/config/).
spring.datasource.url=jdbc:h2:file:./data/notesdb
spring.datasource.username=sa
spring.datasource.password=

# schema.sql owns the schema and runs on every startup (also for non-embedded databases,
# so this keeps working after the move off H2). Hibernate only validates that
# the entities match it and fails startup if they do not (fail safe).
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Security: the H2 web console is disabled. It logs in as "sa" with no password, so it would
# expose every table (including password hashes) to anyone who can reach it. SecurityConfig
# also no longer makes /h2-console public (defence in depth: either control alone blocks it).
spring.h2.console.enabled=false

# Seed demo users/team/notes on startup when there are no users (DemoDataSeeder, README.md).
# TEMPORARY for the demo: the demo accounts share a published password; set to false (or
# remove) before any real deployment. Tests turn this off in src/test/resources/config/.
app.demo-data.enabled=true
