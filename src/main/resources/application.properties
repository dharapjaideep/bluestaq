spring.application.name=demo

# Application version; kept in sync with the VERSION file at the repo root.
app.version=0.5.1

# DEMO-ONLY: file-based H2 database ("sa", empty password) so reviewers need no database
# setup. Data persists between runs in ./data/ (relative to the directory the app is started
# from; git-ignored). Delete data/ to reset to the demo state, or after changing schema.sql
# (CREATE TABLE IF NOT EXISTS won't alter an existing table).
# Production: PostgreSQL with versioned migrations (Flyway) and credentials from a secret
# manager, never an empty password in this file.
# Tests override this with an in-memory database (src/test/resources/config/).
spring.datasource.url=jdbc:h2:file:./data/notesdb
spring.datasource.username=sa
spring.datasource.password=

# schema.sql owns the schema and runs on every startup (also for non-embedded databases,
# so this keeps working after the move off H2). Hibernate only validates that
# the entities match it and fails startup if they do not (fail safe).
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Security: the H2 web console is disabled. It logs in as "sa" with no password, so it would
# expose every table (including password hashes) to anyone who can reach it. SecurityConfig
# also no longer makes /h2-console public (defence in depth: either control alone blocks it).
spring.h2.console.enabled=false

# Seed demo users/team/notes on startup when there are no users (DemoDataSeeder, README.md).
# DEMO-ONLY: the demo accounts share a password published in README.md.
# Production: false (the seeder is off when the property is missing), or enable it only under
# a dedicated "demo" profile. Tests turn this off in src/test/resources/config/.
app.demo-data.enabled=true
