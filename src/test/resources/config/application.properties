# Test-only overrides. Spring Boot loads classpath:/config/application.properties on top of
# classpath:/application.properties, so only the keys below change for tests.

# Tests use a fresh in-memory database, never the file database in data/ that the app uses, so
# test runs can't touch (or be affected by) local demo data.
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1

# Tests seed their own data; demo users would collide with them and break count-based assertions.
app.demo-data.enabled=false
